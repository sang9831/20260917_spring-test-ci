name: CI

# main 브랜치 푸시 시에만 워크플로우 실행
on:
  push:
    branches:
      - main

jobs:
  hello:
    # 우분투 최신 버전에서 작업 실행
    runs-on: ubuntu-latest
    steps:
      # 콘솔에 hello ci! 문자열 출력
      - name: Print hello message
        run: echo "hello ci!"

  test:
    # 우분투 최신 버전 러너에서 잡 실행
    runs-on: ubuntu-latest
    steps:
      # 저장소 코드를 워크플로우 러너로 복제
      - name: Checkout source code
        uses: actions/checkout@v7

      # 프로젝트와 동일한 JDK17 배포판 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          # 의존성 다운로드 결과 자동 캐싱
          cache: 'gradle'

      # 커밋 시 유실되는 실행 권한 재부여
      - name: Grant execute permission
        run: chmod +x gradlew

      # 전체 단위 테스트 실행 후 성공 여부 판정
      - name: Run tests with Gradle
        run: ./gradlew test

      # 테스트 실패 시 리포트를 아티팩트로 보존
      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: build/reports/tests/test
